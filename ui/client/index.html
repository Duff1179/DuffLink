<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>DuffLink Stage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: #080a0c;
    color: #e2e5e9;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 18px 10px;
    border-bottom: 1px solid #111518;
    flex-shrink: 0;
    gap: 8px;
  }
  .pres-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: #4f8ef7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .slide-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #374151;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #1f2937;
    flex-shrink: 0;
  }
  .live-dot.live { background: #34d399; animation: livepulse 2s infinite; }
  .live-dot.offline { background: #7f1d1d; }
  @keyframes livepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.8)} }

  /* ── Current slide ── */
  .current-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: top;
    padding: 18px 22px 14px;
    border-bottom: 1px solid #0c1014;
    min-height: 0;
  }
  .section-eyebrow {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: #1f2937;
    margin-bottom: 9px;
  }
  .current-text {
    font-size: clamp(90px, 24vw, 120px); 
    font-weight: 400;
    line-height: 1.48;
    color: #dde1e7;
    letter-spacing: -0.1px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 7;
    -webkit-box-orient: vertical;
  }
  .current-text.empty { color: #1f2937; font-style: italic; font-size: 15px; }

  /* ── Next slide ── */
  .next-wrap {
    padding: 12px 22px;
    border-bottom: 1px solid #0c1014;
    flex-shrink: 0;
  }
  .next-text {
    font-size: clamp(60px, 19vw, 95px); 
    font-weight: 300;
    color: #374151;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* ── Metrics row (Upgraded Readability) ── */
  .metrics {
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
  }

  .metric {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 8px; /* Increased padding */
    border-right: 1px solid #0c1014;
    min-width: 0;
    overflow: hidden;
  }
  .metric:last-child { border-right: none; }

  .metric-label {
    font-size: 14px; /* Massively increased from 8px */
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: #4b5563; /* Brighter for contrast */
    margin-bottom: 8px;
    white-space: nowrap;
  }
  .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(45px, 12vw, 80px); /* Cleaned up scaling */
    font-weight: 600; /* Thicker numbers */
    color: #e2e5e9;
    letter-spacing: -1.5px;
    white-space: nowrap;
  }
  .metric-value.blue   { color: #4f8ef7; }
  .metric-value.green  { color: #34d399; }
  .metric-value.yellow { color: #fbbf24; }
  .metric-value.red    { color: #f87171; } /* Bright red added */

  .metric-sub {
    font-size: 13px; /* Increased from 8.5px */
    font-weight: 500;
    color: #6b7280;
    margin-top: 6px;
    max-width: 140px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Offline overlay ── */
  .overlay {
    position: fixed; inset: 0;
    background: #080a0c;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; z-index: 100;
  }
  .overlay.hidden { display: none; }
  .overlay-icon  { font-size: 38px; opacity: 0.12; }
  .overlay-title { font-size: 15px; font-weight: 500; color: #374151; }
  .overlay-sub   { font-size: 11px; color: #1f2937; }
  .retry-btn {
    margin-top: 6px; padding: 9px 22px;
    background: #111518; border: 1px solid #1f2937;
    border-radius: 7px; color: #4f8ef7;
    font-size: 12px; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="pres-name" id="presName">Waiting…</span>
    <span class="slide-counter" id="slideCounter">— / —</span>
    <div class="live-dot offline" id="liveDot"></div>
  </div>

  <div class="current-wrap">
    <div class="section-eyebrow">On Screen</div>
    <div class="current-text empty" id="currentText">Waiting for slides…</div>
  </div>

  <div class="next-wrap">
    <div class="section-eyebrow">Up Next</div>
    <div class="next-text" id="nextText" style="color:#1f2937">—</div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Slides Left</div>
      <div class="metric-value blue" id="slidesLeft">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Timer</div>
      <div class="metric-value green" id="timerValue">—</div>
      <div class="metric-sub" id="timerName"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Service</div>
      <div class="metric-value" id="serviceElapsed">—</div>
      <div class="metric-sub">elapsed</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-icon">📡</div>
  <div class="overlay-title">Waiting for host…</div>
  <div class="overlay-sub">Make sure DuffLink is running on the host PC</div>
  <button class="retry-btn" onclick="connect()">Retry</button>
</div>

<script>
  let ws = null;
  let serviceStartTime = null;
  let serviceTimer = null;

  function connect() {
    if (ws) { try { ws.close(); } catch(_){} ws = null; }
    ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('liveDot').className = 'live-dot live';
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') applyState(msg.payload);
      } catch(_) {}
    };

    ws.onclose = () => {
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('liveDot').className = 'live-dot offline';
      setTimeout(connect, 3000);
    };

    ws.onerror = () => { try { ws.close(); } catch(_){} };
  }

  function applyState(s) {
    // Presentation name
    document.getElementById('presName').textContent = s.presentationName || 'No Presentation';

    // Slide counter
    const total = s.slideCount || 0;
    const idx   = s.slideIndex ?? 0;
    document.getElementById('slideCounter').textContent = total ? `${idx + 1} / ${total}` : '— / —';

    // Slides remaining
    const rem = total ? Math.max(0, total - idx - 1) : null;
    const slEl = document.getElementById('slidesLeft');
    slEl.textContent = rem !== null ? rem : '—';
    slEl.className = rem === 0 ? 'metric-value yellow' : 'metric-value blue';

    // Current slide text
    const ct = document.getElementById('currentText');
    if (s.currentSlideText) {
      ct.textContent = s.currentSlideText;
      ct.classList.remove('empty');
    } else {
      ct.textContent = 'Waiting for slides…';
      ct.classList.add('empty');
    }

    // Next slide text
    const nt = document.getElementById('nextText');
    nt.textContent = s.nextSlideText || '—';
    nt.style.color = s.nextSlideText ? '#374151' : '#1f2937';

    // ── STRICT, RAW TIMER LOGIC ──
    const clocks = s.clocks || [];
    
    // Find the one exact timer that is running or overrunning
    const active = clocks.find(c => c.state === "running" || c.state === "overrunning");

    const timerValueEl = document.getElementById('timerValue');
    const timerNameEl = document.getElementById('timerName');

    if (active) {
      // Pass the time string through exactly as ProPresenter sends it
      timerValueEl.textContent = active.time;
      timerNameEl.textContent  = active.name;

      // Turn red if overrunning, green if standard running
      if (active.state === "overrunning") {
        timerValueEl.className = "metric-value red";
      } else {
        timerValueEl.className = "metric-value green";
      }
    } else {
      // If nothing is actively running/overrunning, show empty dashes
      timerValueEl.textContent = "—";
      timerNameEl.textContent  = "";
      timerValueEl.className = "metric-value";
    }

    // Service elapsed
    if (s.serviceStartISO && s.serviceStartISO !== serviceStartTime) {
      serviceStartTime = s.serviceStartISO;
      clearInterval(serviceTimer);
      tickService();
      serviceTimer = setInterval(tickService, 1000);
    }
  }

  function tickService() {
    if (!serviceStartTime) return;
    const elapsed = Math.floor((Date.now() - new Date(serviceStartTime)) / 1000);
    const el = document.getElementById('serviceElapsed');
    if (elapsed < 0) { el.textContent = '—'; el.className = 'metric-value'; return; }
    const h  = Math.floor(elapsed / 3600);
    const m  = Math.floor((elapsed % 3600) / 60);
    const s  = elapsed % 60;
    el.textContent = h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    // Warn after 90 min
    el.className = elapsed > 5400 ? 'metric-value yellow' : 'metric-value';
  }

  connect();
</script>
</body>
</html>
